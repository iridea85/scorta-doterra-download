name: Apply Scorta enhancements

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-scorta-enhancements.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate enhancement runtime
        run: |
          set -euo pipefail
          cat app-enhancements/parts/*.part > app-enhancements/scorta-enhancements-v2.js
          node --check app-enhancements/scorta-enhancements-v2.js
          echo "5f6d26bb48567a4b74fa46de98c93f4625505b0252f28d820e699623a0f3c320  app-enhancements/scorta-enhancements-v2.js" | sha256sum -c -

      - name: Wire enhancements into Pages build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-pages.yml')
          s=p.read_text(encoding='utf-8')

          if '      - "app-enhancements/**"\n' not in s:
              s=s.replace('      - "hub-personale/**"\n', '      - "hub-personale/**"\n      - "app-enhancements/**"\n')

          marker='          test -s site/app-v6/index.html\n'
          addition=(
              '          test -s site/app-v6/index.html\n'
              '          cp app-enhancements/scorta-enhancements-v2.js site/app-v6/scorta-enhancements-v2.js\n'
              '          mkdir -p site/catalog\n'
              '          cp catalog/scorta-catalog.json site/catalog/scorta-catalog.json\n'
          )
          if 'cp app-enhancements/scorta-enhancements-v2.js site/app-v6/scorta-enhancements-v2.js' not in s:
              if marker not in s: raise SystemExit('build marker not found')
              s=s.replace(marker, addition, 1)

          target='''          p.write_text(s, encoding="utf-8")\n          PY\n\n          cat > site/app-v6/flutter_service_worker.js <<'EOF'\n'''
          injected='''          p.write_text(s, encoding="utf-8")\n          PY\n\n          python3 - <<'PY'\n          from pathlib import Path\n          p = Path("site/app-v6/index.html")\n          s = p.read_text(encoding="utf-8")\n          marker = '<script src="install-helper-v6.js"></script>'\n          enhancement = '<script src="scorta-enhancements-v2.js"></script>'\n          if enhancement not in s:\n              if marker not in s: raise SystemExit("install helper marker non trovato")\n              s = s.replace(marker, enhancement + '\\n  ' + marker, 1)\n          p.write_text(s, encoding="utf-8")\n          PY\n\n          cat > site/app-v6/flutter_service_worker.js <<'EOF'\n'''
          if 'enhancement = \'<script src="scorta-enhancements-v2.js"></script>\'' not in s:
              if target not in s: raise SystemExit('service worker marker not found')
              s=s.replace(target, injected, 1)

          if "                  './scorta-enhancements-v2.js',\n" not in s:
              s=s.replace("                  './manifest.json',\n", "                  './manifest.json',\n                  './scorta-enhancements-v2.js',\n", 1)

          s=s.replace('scorta-pwa-v7', 'scorta-pwa-v8')
          s=s.replace('scorta-sw-reload-v7', 'scorta-sw-reload-v8')
          s=s.replace('scorta-doterra-pwa-v7', 'scorta-doterra-pwa-v8')
          s=s.replace('scorta-doterra-license-v1', 'scorta-doterra-license-v2')

          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'scorta-enhancements-v2.js' .github/workflows/deploy-pages.yml
          grep -q 'scorta-pwa-v8' .github/workflows/deploy-pages.yml
          grep -q 'app-enhancements/\*\*' .github/workflows/deploy-pages.yml

      - name: Commit production wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-enhancements/scorta-enhancements-v2.js .github/workflows/deploy-pages.yml
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish Scorta doTERRA 1.2 enhancements"
            git push
          fi

      - name: Deploy updated app now
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches \
            -d '{"ref":"main"}'
