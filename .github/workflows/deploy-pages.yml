name: Deploy all download pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "index.html"
      - "ore/**"
      - "work-tracker-web/**"
      - "Work-Tracker-Android.apk"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara Scorta doTERRA Web App
        run: |
          set -e
          mkdir -p site/app-v4
          cp index.html site/index.html

          curl -fL "https://github.com/iridea85/scorta-doterra-download/releases/download/v1.0.11-it/Scorta-doTERRA-Web.zip"             -o /tmp/Scorta-doTERRA-Web.zip
          unzip -q /tmp/Scorta-doTERRA-Web.zip -d site/app-v4
          test -s site/app-v4/index.html

          cat > site/app-v4/manifest.json <<'EOF'
          {
            "id": "/scorta-doterra-download/app-v4/",
            "name": "Scorta doTERRA",
            "short_name": "Scorta",
            "start_url": "/scorta-doterra-download/app-v4/",
            "scope": "/scorta-doterra-download/app-v4/",
            "display": "standalone",
            "display_override": ["standalone", "minimal-ui"],
            "background_color": "#F7F5F7",
            "theme_color": "#6E5578",
            "description": "Inventario personale doTERRA con catalogo in italiano e lista della spesa.",
            "orientation": "portrait-primary",
            "prefer_related_applications": false,
            "icons": [
              {
                "src": "icons/Icon-192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "icons/Icon-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "icons/Icon-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "maskable"
              }
            ]
          }
          EOF

          cat > site/app-v4/install-helper-v4.js <<'EOF'
          (() => {
            const standalone =
              window.matchMedia('(display-mode: standalone)').matches ||
              window.navigator.standalone === true;
            if (standalone) return;

            const ua = navigator.userAgent || '';
            const isIOS =
              /iPhone|iPad|iPod/i.test(ua) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            let deferredPrompt = null;

            const button = document.createElement('button');
            button.type = 'button';
            button.setAttribute('aria-label', 'Installa Scorta doTERRA');
            button.innerHTML =
              '<span style="font-size:18px;line-height:1">⇩</span><span>Installa</span>';

            Object.assign(button.style, {
              position: 'fixed',
              top: 'calc(10px + env(safe-area-inset-top))',
              right: '12px',
              zIndex: '99999',
              border: '1px solid rgba(110,85,120,.18)',
              borderRadius: '14px',
              padding: '9px 12px',
              background: '#FFFFFF',
              color: '#6E5578',
              fontSize: '14px',
              fontWeight: '800',
              lineHeight: '1',
              display: 'flex',
              alignItems: 'center',
              gap: '6px',
              boxShadow: '0 6px 18px rgba(50,34,56,.12)',
              WebkitTapHighlightColor: 'transparent'
            });

            const removeButton = () => button.remove();

            if (isIOS) {
              document.body.appendChild(button);
              button.onclick = () => {
                alert(
                  'Per installare Scorta doTERRA su iPhone:\\n\\n' +
                  '1. Apri questa pagina in Safari\\n' +
                  '2. Tocca Condividi\\n' +
                  '3. Tocca “Aggiungi alla schermata Home”\\n' +
                  '4. Tocca Aggiungi'
                );
              };
              return;
            }

            button.disabled = true;
            button.style.opacity = '0.55';
            button.style.cursor = 'wait';
            document.body.appendChild(button);

            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.register(
                'flutter_service_worker.js?v=scorta-pwa-v5',
                { scope: './' }
              ).then(() => navigator.serviceWorker.ready)
               .then(() => {
                 if (
                   !navigator.serviceWorker.controller &&
                   sessionStorage.getItem('scorta-sw-reload-v5') !== '1'
                 ) {
                   sessionStorage.setItem('scorta-sw-reload-v5', '1');
                   location.reload();
                 }
               })
               .catch(() => {});
            }

            window.addEventListener('beforeinstallprompt', (event) => {
              event.preventDefault();
              deferredPrompt = event;
              button.disabled = false;
              button.style.opacity = '1';
              button.style.cursor = 'pointer';

              button.onclick = async () => {
                if (!deferredPrompt) return;
                button.disabled = true;
                const promptEvent = deferredPrompt;
                deferredPrompt = null;

                try {
                  await promptEvent.prompt();
                  const choice = await promptEvent.userChoice;
                  if (choice && choice.outcome === 'dismissed') {
                    button.disabled = false;
                    button.style.opacity = '1';
                  }
                } catch (_) {
                  button.disabled = false;
                  button.style.opacity = '1';
                }
              };
            });

            window.addEventListener('appinstalled', removeButton);
          })();
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/app-v4/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              '<base href="/scorta-doterra-download/app/">',
              '<base href="/scorta-doterra-download/app-v4/">'
          )
          marker = '<script src="flutter_bootstrap.js" async></script>'
          if '<script src="install-helper-v4.js"></script>' not in s:
              s = s.replace(marker, '<script src="install-helper-v4.js"></script>\n  ' + marker)
          p.write_text(s, encoding="utf-8")
          PY

          cat > site/app-v4/flutter_service_worker.js <<'EOF'
          const CACHE_NAME = 'scorta-doterra-pwa-v5';

          self.addEventListener('install', (event) => {
            event.waitUntil(
              caches.open(CACHE_NAME)
                .then((cache) => cache.addAll([
                  './',
                  './index.html',
                  './manifest.json',
                  './icons/Icon-192.png',
                  './icons/Icon-512.png'
                ]))
                .then(() => self.skipWaiting())
            );
          });

          self.addEventListener('activate', (event) => {
            event.waitUntil(
              caches.keys()
                .then((keys) => Promise.all(
                  keys
                    .filter((key) => key !== CACHE_NAME)
                    .map((key) => caches.delete(key))
                ))
                .then(() => self.clients.claim())
            );
          });

          self.addEventListener('fetch', (event) => {
            if (event.request.method !== 'GET') return;

            event.respondWith(
              fetch(event.request)
                .then((response) => {
                  if (
                    response &&
                    response.ok &&
                    event.request.url.startsWith(self.location.origin)
                  ) {
                    const copy = response.clone();
                    caches.open(CACHE_NAME)
                      .then((cache) => cache.put(event.request, copy))
                      .catch(() => {});
                  }
                  return response;
                })
                .catch(() => caches.match(event.request))
            );
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("site/app-v4/flutter_bootstrap.js")
          s = p.read_text(encoding="utf-8")
          s, n = re.subn(
              r'serviceWorkerVersion:\s*"[^"]+"',
              'serviceWorkerVersion: "scorta-pwa-v5"',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit("serviceWorkerVersion non trovato nel bootstrap")
          p.write_text(s, encoding="utf-8")
          PY

          test -s site/app-v4/flutter_service_worker.js
          grep -q "self.clients.claim" site/app-v4/flutter_service_worker.js
          grep -q 'serviceWorkerVersion: "scorta-pwa-v5"' site/app-v4/flutter_bootstrap.js

      - name: Mantieni pagina Ore
        run: |
          set -e
          if [ -d ore ]; then cp -R ore site/ore; fi
          if [ -d work-tracker-web ]; then cp -R work-tracker-web site/work-tracker-web; fi
          if [ -f Work-Tracker-Android.apk ]; then cp Work-Tracker-Android.apk site/Work-Tracker-Android.apk; fi
          touch site/.nojekyll

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
