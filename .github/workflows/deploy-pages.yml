name: Deploy all download pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "index.html"
      - "chiavi-scorta/**"
      - "install/**"
      - "ore/**"
      - "work-tracker-web/**"
      - "hub-personale/**"
      - "app-enhancements/**"
      - "Work-Tracker-Android.apk"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara Scorta doTERRA Web App 1.2
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/app-v6 site/catalog
          cp index.html site/index.html
          cp catalog/scorta-catalog.json site/catalog/scorta-catalog.json

          curl -fL "https://github.com/iridea85/scorta-doterra-download/releases/download/v1.0.11-it/Scorta-doTERRA-Web.zip" -o /tmp/Scorta-doTERRA-Web.zip
          unzip -q /tmp/Scorta-doTERRA-Web.zip -d site/app-v6
          test -s site/app-v6/index.html
          test -s site/app-v6/main.dart.js

          cat app-enhancements/parts/*.part > site/app-v6/scorta-enhancements-v2.js
          node --check site/app-v6/scorta-enhancements-v2.js
          echo "5f6d26bb48567a4b74fa46de98c93f4625505b0252f28d820e699623a0f3c320  site/app-v6/scorta-enhancements-v2.js" | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/app-v6/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<base href="/scorta-doterra-download/app/">','<base href="/scorta-doterra-download/app-v6/">')
          marker='<script src="flutter_bootstrap.js" async></script>'
          enhancement='<script src="scorta-enhancements-v2.js"></script>'
          if marker not in s:
              raise SystemExit('flutter bootstrap marker non trovato')
          if enhancement not in s:
              s=s.replace(marker, enhancement+'\n  '+marker, 1)
          p.write_text(s,encoding='utf-8')

          m=Path('site/app-v6/manifest.json')
          if m.exists():
              x=m.read_text(encoding='utf-8').replace('/scorta-doterra-download/app/','/scorta-doterra-download/app-v6/')
              m.write_text(x,encoding='utf-8')
          PY

          cat > site/app-v6/flutter_service_worker.js <<'EOF'
          const CACHE_NAME = 'scorta-doterra-pwa-v8';
          self.addEventListener('install', (event) => {
            event.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll([
              './','./index.html','./manifest.json','./scorta-enhancements-v2.js','./icons/Icon-192.png','./icons/Icon-512.png'
            ])).then(() => self.skipWaiting()));
          });
          self.addEventListener('activate', (event) => {
            event.waitUntil(caches.keys().then((keys) => Promise.all(
              keys.filter((key) => key.startsWith('scorta-doterra-') && key !== CACHE_NAME).map((key) => caches.delete(key))
            )).then(() => self.clients.claim()));
          });
          self.addEventListener('fetch', (event) => {
            if (event.request.method !== 'GET') return;
            event.respondWith(fetch(event.request).then((response) => {
              if (response && response.ok && event.request.url.startsWith(self.location.origin)) {
                const copy=response.clone();
                caches.open(CACHE_NAME).then((cache) => cache.put(event.request,copy)).catch(() => {});
              }
              return response;
            }).catch(() => caches.match(event.request)));
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('site/app-v6/flutter_bootstrap.js')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'serviceWorkerVersion:\s*"[^"]+"','serviceWorkerVersion: "scorta-pwa-v8"',s,count=1)
          if n != 1:
              raise SystemExit('serviceWorkerVersion non trovato')
          p.write_text(s,encoding='utf-8')
          PY

          rm -rf site/app-v7
          cp -R site/app-v6 site/app-v7
          cp app-enhancements/license-gate-v1.js site/app-v7/license-gate-v1.js

          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/app-v7/index.html')
          s=p.read_text(encoding='utf-8').replace('/scorta-doterra-download/app-v6/','/scorta-doterra-download/app-v7/')
          marker='<script src="flutter_bootstrap.js" async></script>'
          if marker not in s:
              raise SystemExit('bootstrap app-v7 non trovato')
          s=s.replace(marker,'<script src="license-gate-v1.js"></script>',1)
          p.write_text(s,encoding='utf-8')

          m=Path('site/app-v7/manifest.json')
          if m.exists():
              x=m.read_text(encoding='utf-8').replace('/scorta-doterra-download/app-v6/','/scorta-doterra-download/app-v7/')
              m.write_text(x,encoding='utf-8')

          sw=Path('site/app-v7/flutter_service_worker.js')
          x=sw.read_text(encoding='utf-8').replace('scorta-doterra-pwa-v8','scorta-doterra-license-v2')
          sw.write_text(x,encoding='utf-8')
          PY

          grep -q 'scorta-enhancements-v2.js' site/app-v6/index.html
          grep -q 'scorta-enhancements-v2.js' site/app-v7/index.html
          grep -q 'license-gate-v1.js' site/app-v7/index.html
          grep -q 'serviceWorkerVersion: "scorta-pwa-v8"' site/app-v6/flutter_bootstrap.js

      - name: Mantieni pagine e download esistenti
        run: |
          set -e
          if [ -d chiavi-scorta ]; then cp -R chiavi-scorta site/chiavi-scorta; fi
          if [ -d install ]; then cp -R install site/install; fi
          if [ -d ore ]; then cp -R ore site/ore; fi
          if [ -d work-tracker-web ]; then cp -R work-tracker-web site/work-tracker-web; fi
          if [ -d hub-personale ]; then cp -R hub-personale site/hub-personale; fi
          if [ -f Work-Tracker-Android.apk ]; then cp Work-Tracker-Android.apk site/Work-Tracker-Android.apk; fi
          touch site/.nojekyll

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
