name: Deploy all download pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "index.html"
      - "chiavi-scorta/**"
      - "install/**"
      - "ore/**"
      - "work-tracker-web/**"
      - "hub-personale/**"
      - "app-enhancements/**"
      - "catalog/**"
      - "Work-Tracker-Android.apk"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara Scorta doTERRA v14
        run: |
          set -euo pipefail
          export ASSET_VERSION="${GITHUB_SHA:0:12}"
          rm -rf site
          mkdir -p site/app-v14 site/catalog
          cp index.html site/index.html
          cp catalog/scorta-catalog.json site/catalog/scorta-catalog.json

          curl -fL "https://github.com/iridea85/scorta-doterra-download/releases/download/v1.0.11-it/Scorta-doTERRA-Web.zip" -o /tmp/Scorta-doTERRA-Web.zip
          unzip -q /tmp/Scorta-doTERRA-Web.zip -d site/app-v14
          test -s site/app-v14/index.html
          test -s site/app-v14/main.dart.js

          cat app-enhancements/parts/*.part > site/app-v14/scorta-enhancements-v2.js
          cp app-enhancements/nav-layout-v12.js site/app-v14/nav-layout-v21.js
          node --check site/app-v14/scorta-enhancements-v2.js
          node --check site/app-v14/nav-layout-v21.js

          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib, binascii, json, re, os

          asset_version=os.environ['ASSET_VERSION']

          # 1) Corregge il build Flutter originale alla fonte.
          main=Path('site/app-v14/main.dart.js')
          s=main.read_text(encoding='utf-8')

          old='q=!m.e&&m.f===0?new A.rQ(B.oC,new A.all(m),B.WW,l):l'
          if s.count(old) != 1:
              raise SystemExit(f'Pattern Apri catalogo inatteso: {s.count(old)}')
          s=s.replace(old,'q=l',1)

          old_icon='B.Hi=new A.cp(B.ky,58,B.dq,null,null)'
          new_icon='B.Hi=new A.cp(new A.c3(9829,null,!1),58,B.dq,null,null)'
          if s.count(old_icon) != 1:
              raise SystemExit(f'Pattern icona Home inatteso: {s.count(old_icon)}')
          s=s.replace(old_icon,new_icon,1)
          main.write_text(s,encoding='utf-8')

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', binascii.crc32(kind + data) & 0xffffffff)

          def write_icon(path, size):
              purple=(110,85,120)
              white=(255,255,255)
              rows=[]
              for y in range(size):
                  ny=(y+0.5)/size
                  row=bytearray([0])
                  for x in range(size):
                      nx=(x+0.5)/size
                      col=purple
                      hx=(nx-.5)/.235
                      hy=(ny-.515)/.215
                      yy=-hy
                      heart=(hx*hx+yy*yy-1)**3-hx*hx*yy*yy*yy <= 0
                      if heart and .24 < ny < .77:
                          col=white
                      row.extend((*col,255))
                  rows.append(bytes(row))
              raw=b''.join(rows)
              png=(b'\x89PNG\r\n\x1a\n'
                   +chunk(b'IHDR',struct.pack('>IIBBBBB',size,size,8,6,0,0,0))
                   +chunk(b'IDAT',zlib.compress(raw,9))
                   +chunk(b'IEND',b''))
              p=Path(path); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(png)

          write_icon('site/app-v14/icons/Icon-192-heart-v14.png',192)
          write_icon('site/app-v14/icons/Icon-512-heart-v14.png',512)
          Path('site/app-v14/icons/Icon-192.png').write_bytes(Path('site/app-v14/icons/Icon-192-heart-v14.png').read_bytes())
          Path('site/app-v14/icons/Icon-512.png').write_bytes(Path('site/app-v14/icons/Icon-512-heart-v14.png').read_bytes())

          # 2) Configura index + manifest. Gli asset usano SEMPRE il commit corrente
          # come versione, così browser e PWA non possono riutilizzare script vecchi.
          p=Path('site/app-v14/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<base href="/scorta-doterra-download/app/">','<base href="/scorta-doterra-download/app-v14/">')
          s=s.replace('icons/Icon-192.png','icons/Icon-192-heart-v14.png')
          s=s.replace('icons/Icon-512.png','icons/Icon-512-heart-v14.png')
          s=s.replace('href="manifest.json"',f'href="manifest.json?v={asset_version}"')
          marker='<script src="flutter_bootstrap.js" async></script>'
          if marker not in s:
              raise SystemExit('flutter bootstrap marker non trovato')
          scripts=(f'<script src="scorta-enhancements-v2.js?v={asset_version}"></script>\n'
                   f'  <script src="nav-layout-v21.js?v={asset_version}"></script>')
          s=s.replace(marker,scripts+'\n  '+marker,1)
          p.write_text(s,encoding='utf-8')

          m=Path('site/app-v14/manifest.json')
          data=json.loads(m.read_text(encoding='utf-8')) if m.exists() else {}
          data.update({
            'name':'Scorta doTERRA',
            'short_name':'Scorta doTERRA',
            'id':'/scorta-doterra-download/app-v14/',
            'start_url':'/scorta-doterra-download/app-v14/',
            'scope':'/scorta-doterra-download/app-v14/',
            'display':'standalone',
            'theme_color':'#6e5578',
            'background_color':'#6e5578',
          })
          data['icons']=[
            {'src':'icons/Icon-192-heart-v14.png','sizes':'192x192','type':'image/png','purpose':'any maskable'},
            {'src':'icons/Icon-512-heart-v14.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}
          ]
          m.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')

          b=Path('site/app-v14/flutter_bootstrap.js')
          bs=b.read_text(encoding='utf-8')
          bs,n=re.subn(r'serviceWorkerVersion:\s*"[^"]+"',f'serviceWorkerVersion: "scorta-pwa-{asset_version}"',bs,count=1)
          if n!=1:
              raise SystemExit('serviceWorkerVersion non trovato')
          b.write_text(bs,encoding='utf-8')
          PY

          node --check site/app-v14/main.dart.js

          cat > site/app-v14/flutter_service_worker.js <<EOF
          const CACHE_NAME='scorta-doterra-pwa-${ASSET_VERSION}';
          self.addEventListener('install',event=>event.waitUntil(caches.open(CACHE_NAME).then(cache=>cache.addAll([
            './','./index.html','./manifest.json?v=${ASSET_VERSION}','./scorta-enhancements-v2.js?v=${ASSET_VERSION}','./nav-layout-v21.js?v=${ASSET_VERSION}','./icons/Icon-192-heart-v14.png','./icons/Icon-512-heart-v14.png'
          ])).then(()=>self.skipWaiting())));
          self.addEventListener('activate',event=>event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('scorta-doterra-')&&k!==CACHE_NAME).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',event=>{
            if(event.request.method!=='GET') return;
            event.respondWith(fetch(event.request,{cache:'no-store'}).then(response=>{
              if(response&&response.ok&&event.request.url.startsWith(self.location.origin)){
                const copy=response.clone();
                caches.open(CACHE_NAME).then(cache=>cache.put(event.request,copy)).catch(()=>{});
              }
              return response;
            }).catch(()=>caches.match(event.request)));
          });
          EOF

          for old in app-v6 app-v12 app-v13; do
            mkdir -p "site/$old/icons"
            cp site/app-v14/icons/Icon-192-heart-v14.png "site/$old/icons/Icon-192.png"
            cp site/app-v14/icons/Icon-512-heart-v14.png "site/$old/icons/Icon-512.png"
            cat > "site/$old/index.html" <<EOF
          <!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6e5578"><title>Scorta doTERRA</title></head><body><script>location.replace('../app-v14/'+location.search+location.hash);</script><p>Aggiornamento Scorta doTERRA…</p></body></html>
          EOF
            cat > "site/$old/manifest.json" <<EOF
          {"name":"Scorta doTERRA","short_name":"Scorta doTERRA","id":"/scorta-doterra-download/$old/","start_url":"/scorta-doterra-download/$old/","scope":"/scorta-doterra-download/$old/","display":"standalone","theme_color":"#6e5578","background_color":"#6e5578","icons":[{"src":"icons/Icon-192.png","sizes":"192x192","type":"image/png","purpose":"any maskable"},{"src":"icons/Icon-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}
          EOF
          done

          rm -rf site/app-v7
          cp -R site/app-v14 site/app-v7
          cp app-enhancements/license-gate-v1.js site/app-v7/license-gate-v1.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('site/app-v7/index.html')
          s=p.read_text(encoding='utf-8').replace('/scorta-doterra-download/app-v14/','/scorta-doterra-download/app-v7/')
          marker='<script src="flutter_bootstrap.js" async></script>'
          if marker in s:
              s=s.replace(marker,'<script src="license-gate-v1.js"></script>',1)
          p.write_text(s,encoding='utf-8')
          m=Path('site/app-v7/manifest.json')
          data=json.loads(m.read_text(encoding='utf-8'))
          data['id']=data['start_url']=data['scope']='/scorta-doterra-download/app-v7/'
          m.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

          grep -q 'nav-layout-v21.js' site/app-v14/index.html
          grep -q 'scortaSimpleBottomNavV21' site/app-v14/nav-layout-v21.js
          ! grep -q 'q=!m.e&&m.f===0?new A.rQ(B.oC,new A.all(m),B.WW,l):l' site/app-v14/main.dart.js
          grep -q 'new A.c3(9829,null,!1)' site/app-v14/main.dart.js
          grep -q 'Icon-192-heart-v14.png' site/app-v14/manifest.json
          test -s site/app-v14/icons/Icon-512-heart-v14.png

      - name: Mantieni pagine e download esistenti
        run: |
          set -e
          if [ -d chiavi-scorta ]; then cp -R chiavi-scorta site/chiavi-scorta; fi
          if [ -d install ]; then cp -R install site/install; fi
          if [ -d ore ]; then cp -R ore site/ore; fi
          if [ -d work-tracker-web ]; then cp -R work-tracker-web site/work-tracker-web; fi
          if [ -d hub-personale ]; then cp -R hub-personale site/hub-personale; fi
          if [ -f Work-Tracker-Android.apk ]; then cp Work-Tracker-Android.apk site/Work-Tracker-Android.apk; fi
          touch site/.nojekyll

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
