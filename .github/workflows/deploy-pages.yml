name: Deploy all download pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "index.html"
      - "ore/**"
      - "work-tracker-web/**"
      - "Work-Tracker-Android.apk"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara Scorta doTERRA Web App
        run: |
          set -e
          mkdir -p site/app-v2
          cp index.html site/index.html

          curl -fL "https://github.com/iridea85/scorta-doterra-download/releases/download/v1.0.11-it/Scorta-doTERRA-Web.zip"             -o /tmp/Scorta-doTERRA-Web.zip
          unzip -q /tmp/Scorta-doTERRA-Web.zip -d site/app-v2
          test -s site/app-v2/index.html

          cat > site/app-v2/manifest.json <<'EOF'
          {
            "id": "/scorta-doterra-download/app-v2/",
            "name": "Scorta doTERRA",
            "short_name": "Scorta",
            "start_url": "/scorta-doterra-download/app-v2/",
            "scope": "/scorta-doterra-download/app-v2/",
            "display": "standalone",
            "display_override": ["standalone", "minimal-ui"],
            "background_color": "#F7F5F7",
            "theme_color": "#6E5578",
            "description": "Inventario personale doTERRA con catalogo in italiano e lista della spesa.",
            "orientation": "portrait-primary",
            "prefer_related_applications": false,
            "icons": [
              {
                "src": "icons/Icon-192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "icons/Icon-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "icons/Icon-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "maskable"
              }
            ]
          }
          EOF

          cat > site/app-v2/install-helper-v2.js <<'EOF'
          (() => {
            const standalone =
              window.matchMedia('(display-mode: standalone)').matches ||
              window.navigator.standalone === true;
            if (standalone) return;

            const ua = navigator.userAgent || '';
            const isIOS =
              /iPhone|iPad|iPod/i.test(ua) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            let deferredPrompt = null;
            let installButton = null;

            const ensureButton = () => {
              if (installButton) return installButton;

              installButton = document.createElement('button');
              installButton.type = 'button';
              installButton.setAttribute('aria-label', 'Installa Scorta doTERRA');
              installButton.innerHTML =
                '<span style="font-size:18px;line-height:1">⇩</span><span>Installa</span>';

              Object.assign(installButton.style, {
                position: 'fixed',
                top: 'calc(10px + env(safe-area-inset-top))',
                right: '12px',
                zIndex: '99999',
                border: '1px solid rgba(110,85,120,.18)',
                borderRadius: '14px',
                padding: '9px 12px',
                background: '#FFFFFF',
                color: '#6E5578',
                fontSize: '14px',
                fontWeight: '800',
                lineHeight: '1',
                display: 'flex',
                alignItems: 'center',
                gap: '6px',
                boxShadow: '0 6px 18px rgba(50,34,56,.12)',
                WebkitTapHighlightColor: 'transparent'
              });

              document.body.appendChild(installButton);
              return installButton;
            };

            const removeButton = () => {
              if (installButton) installButton.remove();
              installButton = null;
            };

            const button = ensureButton();

            if (isIOS) {
              button.addEventListener('click', () => {
                alert(
                  'Per installare Scorta doTERRA su iPhone:\\n\\n' +
                  '1. Apri questa pagina in Safari\\n' +
                  '2. Tocca Condividi\\n' +
                  '3. Tocca “Aggiungi alla schermata Home”\\n' +
                  '4. Tocca Aggiungi'
                );
              });
            }

            if (!isIOS) {
              button.onclick = () => {
                if (deferredPrompt) {
                  button.disabled = true;
                  deferredPrompt.prompt().then(() => deferredPrompt.userChoice).then(() => {
                    deferredPrompt = null;
                    removeButton();
                  }).catch(() => {
                    button.disabled = false;
                  });
                  return;
                }

                const current =
                  location.host +
                  location.pathname +
                  location.search +
                  location.hash;

                location.href =
                  'intent://' + current +
                  '#Intent;scheme=https;package=com.android.chrome;' +
                  'S.browser_fallback_url=' +
                  encodeURIComponent(location.href) +
                  ';end';
              };
            }

            window.addEventListener('beforeinstallprompt', (event) => {
              event.preventDefault();
              deferredPrompt = event;

              button.onclick = async () => {
                if (!deferredPrompt) return;
                button.disabled = true;
                await deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
                removeButton();
              };
            });

            window.addEventListener('appinstalled', removeButton);
          })();
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/app-v2/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              '<base href="/scorta-doterra-download/app/">',
              '<base href="/scorta-doterra-download/app-v2/">'
          )
          marker = '<script src="flutter_bootstrap.js" async></script>'
          if '<script src="install-helper-v2.js"></script>' not in s:
              s = s.replace(marker, '<script src="install-helper-v2.js"></script>\n  ' + marker)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Mantieni pagina Ore
        run: |
          set -e
          if [ -d ore ]; then cp -R ore site/ore; fi
          if [ -d work-tracker-web ]; then cp -R work-tracker-web site/work-tracker-web; fi
          if [ -f Work-Tracker-Android.apk ]; then cp Work-Tracker-Android.apk site/Work-Tracker-Android.apk; fi
          touch site/.nojekyll

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
