name: Deploy all download pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "index.html"
      - "chiavi-scorta/**"
      - "install/**"
      - "ore/**"
      - "work-tracker-web/**"
      - "hub-personale/**"
      - "app-enhancements/**"
      - "catalog/**"
      - "Work-Tracker-Android.apk"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara Scorta doTERRA v13
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/app-v13 site/catalog
          cp index.html site/index.html
          cp catalog/scorta-catalog.json site/catalog/scorta-catalog.json

          curl -fL "https://github.com/iridea85/scorta-doterra-download/releases/download/v1.0.11-it/Scorta-doTERRA-Web.zip" -o /tmp/Scorta-doTERRA-Web.zip
          unzip -q /tmp/Scorta-doTERRA-Web.zip -d site/app-v13
          test -s site/app-v13/index.html
          test -s site/app-v13/main.dart.js

          cat app-enhancements/parts/*.part > site/app-v13/scorta-enhancements-v2.js
          cp app-enhancements/nav-layout-v12.js site/app-v13/nav-layout-v13.js
          node --check site/app-v13/scorta-enhancements-v2.js
          node --check site/app-v13/nav-layout-v13.js

          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib, binascii, json, re

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', binascii.crc32(kind + data) & 0xffffffff)

          def write_icon(path, size):
              # Icona volutamente minimale: viola pieno + cuore bianco.
              purple=(110,85,120)
              white=(255,255,255)
              rows=[]
              for y in range(size):
                  ny=(y+0.5)/size
                  row=bytearray([0])
                  for x in range(size):
                      nx=(x+0.5)/size
                      col=purple

                      # Cuore grande e centrato.
                      hx=(nx-.5)/.235
                      hy=(ny-.515)/.215
                      yy=-hy
                      heart=(hx*hx+yy*yy-1)**3-hx*hx*yy*yy*yy <= 0
                      if heart and .24 < ny < .77:
                          col=white

                      row.extend((*col,255))
                  rows.append(bytes(row))

              raw=b''.join(rows)
              png=(b'\x89PNG\r\n\x1a\n'
                   +chunk(b'IHDR',struct.pack('>IIBBBBB',size,size,8,6,0,0,0))
                   +chunk(b'IDAT',zlib.compress(raw,9))
                   +chunk(b'IEND',b''))
              p=Path(path)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(png)

          write_icon('site/app-v13/icons/Icon-192-heart-v13.png',192)
          write_icon('site/app-v13/icons/Icon-512-heart-v13.png',512)
          Path('site/app-v13/icons/Icon-192.png').write_bytes(Path('site/app-v13/icons/Icon-192-heart-v13.png').read_bytes())
          Path('site/app-v13/icons/Icon-512.png').write_bytes(Path('site/app-v13/icons/Icon-512-heart-v13.png').read_bytes())

          p=Path('site/app-v13/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<base href="/scorta-doterra-download/app/">','<base href="/scorta-doterra-download/app-v13/">')
          s=s.replace('icons/Icon-192.png','icons/Icon-192-heart-v13.png')
          s=s.replace('icons/Icon-512.png','icons/Icon-512-heart-v13.png')
          s=s.replace('href="manifest.json"','href="manifest.json?v=13"')
          marker='<script src="flutter_bootstrap.js" async></script>'
          if marker not in s:
              raise SystemExit('flutter bootstrap marker non trovato')
          scripts='<script src="scorta-enhancements-v2.js?v=13"></script>\n  <script src="nav-layout-v13.js?v=13"></script>'
          s=s.replace(marker,scripts+'\n  '+marker,1)
          p.write_text(s,encoding='utf-8')

          m=Path('site/app-v13/manifest.json')
          data=json.loads(m.read_text(encoding='utf-8')) if m.exists() else {}
          data['name']='Scorta doTERRA'
          data['short_name']='Scorta doTERRA'
          data['id']='/scorta-doterra-download/app-v13/'
          data['start_url']='/scorta-doterra-download/app-v13/'
          data['scope']='/scorta-doterra-download/app-v13/'
          data['display']='standalone'
          data['theme_color']='#6e5578'
          data['background_color']='#6e5578'
          data['icons']=[
            {'src':'icons/Icon-192-heart-v13.png','sizes':'192x192','type':'image/png','purpose':'any maskable'},
            {'src':'icons/Icon-512-heart-v13.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}
          ]
          m.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')

          b=Path('site/app-v13/flutter_bootstrap.js')
          bs=b.read_text(encoding='utf-8')
          bs,n=re.subn(r'serviceWorkerVersion:\s*"[^"]+"','serviceWorkerVersion: "scorta-pwa-v13"',bs,count=1)
          if n!=1:
              raise SystemExit('serviceWorkerVersion non trovato')
          b.write_text(bs,encoding='utf-8')
          PY

          cat > site/app-v13/flutter_service_worker.js <<'EOF'
          const CACHE_NAME='scorta-doterra-pwa-v13';
          self.addEventListener('install',event=>event.waitUntil(caches.open(CACHE_NAME).then(cache=>cache.addAll([
            './','./index.html','./manifest.json?v=13','./scorta-enhancements-v2.js?v=13','./nav-layout-v13.js?v=13','./icons/Icon-192-heart-v13.png','./icons/Icon-512-heart-v13.png'
          ])).then(()=>self.skipWaiting())));
          self.addEventListener('activate',event=>event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('scorta-doterra-')&&k!==CACHE_NAME).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',event=>{
            if(event.request.method!=='GET') return;
            event.respondWith(fetch(event.request).then(response=>{
              if(response&&response.ok&&event.request.url.startsWith(self.location.origin)){
                const copy=response.clone();
                caches.open(CACHE_NAME).then(cache=>cache.put(event.request,copy)).catch(()=>{});
              }
              return response;
            }).catch(()=>caches.match(event.request)));
          });
          EOF

          # Vecchie installazioni: portale alla v13.
          for old in app-v6 app-v12; do
            mkdir -p "site/$old/icons"
            cp site/app-v13/icons/Icon-192-heart-v13.png "site/$old/icons/Icon-192.png"
            cp site/app-v13/icons/Icon-512-heart-v13.png "site/$old/icons/Icon-512.png"
            cat > "site/$old/index.html" <<EOF
          <!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6e5578"><title>Scorta doTERRA</title></head><body><script>location.replace('../app-v13/'+location.search+location.hash);</script><p>Aggiornamento Scorta doTERRA…</p></body></html>
          EOF
            cat > "site/$old/manifest.json" <<EOF
          {"name":"Scorta doTERRA","short_name":"Scorta doTERRA","id":"/scorta-doterra-download/$old/","start_url":"/scorta-doterra-download/$old/","scope":"/scorta-doterra-download/$old/","display":"standalone","theme_color":"#6e5578","background_color":"#6e5578","icons":[{"src":"icons/Icon-192.png","sizes":"192x192","type":"image/png","purpose":"any maskable"},{"src":"icons/Icon-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}
          EOF
          done

          # Compatibilità app-v7 con licenza.
          rm -rf site/app-v7
          cp -R site/app-v13 site/app-v7
          cp app-enhancements/license-gate-v1.js site/app-v7/license-gate-v1.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('site/app-v7/index.html')
          s=p.read_text(encoding='utf-8').replace('/scorta-doterra-download/app-v13/','/scorta-doterra-download/app-v7/')
          marker='<script src="flutter_bootstrap.js" async></script>'
          if marker in s:
              s=s.replace(marker,'<script src="license-gate-v1.js"></script>',1)
          p.write_text(s,encoding='utf-8')
          m=Path('site/app-v7/manifest.json')
          data=json.loads(m.read_text(encoding='utf-8'))
          data['id']=data['start_url']=data['scope']='/scorta-doterra-download/app-v7/'
          m.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

          grep -q 'nav-layout-v13.js' site/app-v13/index.html
          grep -q 'app-v13' site/app-v6/index.html
          grep -q 'app-v13' site/app-v12/index.html
          grep -q 'Icon-192-heart-v13.png' site/app-v13/manifest.json
          test -s site/app-v13/icons/Icon-512-heart-v13.png

      - name: Mantieni pagine e download esistenti
        run: |
          set -e
          if [ -d chiavi-scorta ]; then cp -R chiavi-scorta site/chiavi-scorta; fi
          if [ -d install ]; then cp -R install site/install; fi
          if [ -d ore ]; then cp -R ore site/ore; fi
          if [ -d work-tracker-web ]; then cp -R work-tracker-web site/work-tracker-web; fi
          if [ -d hub-personale ]; then cp -R hub-personale site/hub-personale; fi
          if [ -f Work-Tracker-Android.apk ]; then cp Work-Tracker-Android.apk site/Work-Tracker-Android.apk; fi
          touch site/.nojekyll

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
