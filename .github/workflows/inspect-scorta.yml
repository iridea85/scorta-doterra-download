name: Inspect Scorta build

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-scorta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current web release
        run: |
          set -euo pipefail
          rm -rf /tmp/scorta && mkdir -p /tmp/scorta inspection
          curl -fL "https://github.com/iridea85/scorta-doterra-download/releases/download/v1.0.11-it/Scorta-doTERRA-Web.zip" -o /tmp/scorta.zip
          unzip -q /tmp/scorta.zip -d /tmp/scorta
          {
            echo "=== FILES ==="
            find /tmp/scorta -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
            echo
            echo "=== INDEX ==="
            sed -n '1,220p' /tmp/scorta/index.html 2>/dev/null || true
            echo
            echo "=== MAIN.DART.JS SEARCH ==="
            JS=/tmp/scorta/main.dart.js
            if [ -f "$JS" ]; then
              echo "size=$(wc -c < "$JS")"
              python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/scorta/main.dart.js')
          s=p.read_text('utf-8', errors='ignore')
          terms=['localStorage','indexedDB','shared_preferences','hive','inventario','Inventario','lista della spesa','Lista della spesa','catalogo','Catalogo','Wild Orange','Arancio','quantita','quantità','aperto','Aperto','soglia','threshold','shopping','prefer']
          for term in terms:
              print(f'--- {term} ---')
              hits=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
              print('hits',len(hits))
              for pos in hits[:12]:
                  a=max(0,pos-240); b=min(len(s),pos+420)
                  print(s[a:b].replace('\n',' ')[:700])
                  print()
          # Extract likely string constants relevant to storage/catalog.
          vals=[]
          for m in re.finditer(r'"([^"\\]{3,120})"',s):
              v=m.group(1)
              lv=v.lower()
              if any(k in lv for k in ['scorta','invent','catalog','spesa','product','prodot','quant','soglia','apert','prefer','acquist','shared_preferences']):
                  vals.append(v)
          print('=== LIKELY STRINGS ===')
          for v in sorted(set(vals))[:1200]: print(v)
          PY
            fi
            echo
            echo "=== MAP FILES ==="
            find /tmp/scorta -type f \( -name '*.map' -o -name '*.dart' \) -printf '%P %s bytes\n' | sort || true
          } > inspection/scorta-report.txt
      - name: Commit inspection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspection/scorta-report.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: inspect current Scorta web build"
          git push
