name: Inspect Scorta Flutter UI strings

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/inspect-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download web build
        run: |
          set -euo pipefail
          curl -fL "https://github.com/iridea85/scorta-doterra-download/releases/download/v1.0.11-it/Scorta-doTERRA-Web.zip" -o /tmp/scorta.zip
          rm -rf /tmp/scorta-ui
          mkdir -p /tmp/scorta-ui
          unzip -q /tmp/scorta.zip -d /tmp/scorta-ui
      - name: Inspect labels and icon constants in compiled JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/scorta-ui/main.dart.js')
          s=p.read_text(encoding='utf-8',errors='replace')
          terms=['Apri catalogo','Scegli dal catalogo','Catalogo','Il tuo inventario doTERRA','B.Hi=','B.oC=','B.Gg=']
          for term in terms:
              print('\n===',term,'===')
              start=0
              count=0
              while True:
                  i=s.find(term,start)
                  if i<0: break
                  count+=1
                  print('OCCURRENCE',count,'INDEX',i)
                  print(s[max(0,i-1200):min(len(s),i+1800)])
                  print('\n---')
                  start=i+len(term)
                  if count>=10: break
              print('COUNT_SHOWN',count)
          PY
