name: Staged load test once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/load-test-once.yml"

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run staged safe load test
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures as cf
          import statistics, time, urllib.request, urllib.error, socket

          TARGETS = [
              ("SCORTA", "https://iridea85.github.io/scorta-doterra-download/app-v6/?load_test=1"),
              ("RW", "https://rw-hub.it/?load_test=1"),
          ]
          STAGES = [25, 50, 100, 200, 400]
          UA = "Chiara-Owned-App-Load-Test/1.0"
          TIMEOUT = 20

          def one(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Cache-Control": "no-cache"})
              t0 = time.perf_counter()
              code = 0
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                      code = r.getcode() or 0
                      r.read(1024)
              except urllib.error.HTTPError as e:
                  code = e.code
              except (urllib.error.URLError, TimeoutError, socket.timeout, OSError):
                  code = 0
              return code, time.perf_counter() - t0

          def pct(values, p):
              if not values:
                  return 0.0
              xs = sorted(values)
              i = int(round((len(xs)-1) * p))
              return xs[max(0, min(i, len(xs)-1))]

          print("LOAD_TEST_BEGIN")
          for name, url in TARGETS:
              print(f"TARGET {name} {url}")
              stopped = False
              for c in STAGES:
                  if stopped:
                      break
                  n = max(100, c * 3)
                  t0 = time.perf_counter()
                  with cf.ThreadPoolExecutor(max_workers=c) as ex:
                      results = list(ex.map(one, [url] * n))
                  wall = time.perf_counter() - t0
                  times = [x[1] for x in results]
                  ok = sum(1 for code, _ in results if 200 <= code < 400)
                  err = n - ok
                  err_rate = err / n
                  avg = statistics.fmean(times) if times else 0.0
                  p50 = pct(times, .50)
                  p95 = pct(times, .95)
                  mx = max(times) if times else 0.0
                  rps = n / wall if wall else 0.0
                  codes = {}
                  for code, _ in results:
                      codes[code] = codes.get(code, 0) + 1
                  print(
                      f"RESULT target={name} concurrency={c} requests={n} ok={ok} errors={err} "
                      f"error_pct={err_rate*100:.2f} avg_s={avg:.3f} p50_s={p50:.3f} "
                      f"p95_s={p95:.3f} max_s={mx:.3f} rps={rps:.1f} codes={codes}"
                  )
                  if err_rate > 0.05 or p95 > 8.0:
                      print(f"STOP target={name} reason=safety_threshold")
                      stopped = True
                  time.sleep(2)
          print("LOAD_TEST_END")
          PY
