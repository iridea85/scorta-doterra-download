name: Deploy download page

on:
  push:
    branches: [ "main" ]
    paths:
      - "index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara sito
        run: |
          set -e
          mkdir -p site
          cp index.html site/index.html
          curl -fL "https://github.com/iridea85/scorta-doterra-download/releases/download/v1.0.11-it/Scorta-doTERRA.apk" -o site/Scorta-doTERRA.apk
          curl -fL "https://github.com/iridea85/scorta-doterra-download/releases/download/v1.0.11-it/Scorta-doTERRA-iPhone-UNSIGNED.ipa" -o site/Scorta-doTERRA-iPhone-UNSIGNED.ipa
          touch site/.nojekyll
          test -s site/Scorta-doTERRA.apk
          test -s site/Scorta-doTERRA-iPhone-UNSIGNED.ipa

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
