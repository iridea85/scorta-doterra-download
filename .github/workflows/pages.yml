name: Deploy download page

on:
  push:
    branches: [ "main" ]
    paths:
      - "index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara sito e web app iPhone
        run: |
          set -e
          mkdir -p site/app
          cp index.html site/index.html
          WEB_URL="https://github.com/iridea85/scorta-doterra-download/releases/download/v1.0.11-it/Scorta-doTERRA-Web.zip"
          ok=0
          for i in $(seq 1 20); do
            if curl -fL "$WEB_URL" -o /tmp/Scorta-doTERRA-Web.zip; then
              ok=1
              break
            fi
            echo "Web app non ancora pronta, nuovo tentativo tra 5 secondi..."
            sleep 5
          done
          test "$ok" = "1"
          unzip -q /tmp/Scorta-doTERRA-Web.zip -d site/app
          touch site/.nojekyll
          test -s site/app/index.html

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
