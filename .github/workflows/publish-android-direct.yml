name: Publish Android APK direct

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-android-direct.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scarica APK stabile
        run: |
          set -e
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-d5d0-81f5-9309-4ef4cebbcdc5/raw?se=2026-09-02T10%3A13%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=a372bd14-01b2-52d4-a0e1-6a39eaf46f8f&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-01T23%3A26%3A33Z&ske=2026-09-02T23%3A26%3A33Z&sks=b&skv=2026-02-06&sig=QNgqwy81rsu/Et2GTlBDZBZVEmUNoTohamnw8hNpVfE%3D' -o /tmp/android.zip
          rm -rf /tmp/android
          mkdir -p /tmp/android
          unzip -j /tmp/android.zip '*.apk' -d /tmp/android
          APK_FILE=$(find /tmp/android -type f -name '*.apk' -print -quit)
          test -n "$APK_FILE"
          cp "$APK_FILE" Work-Tracker-Android.apk
          test -s Work-Tracker-Android.apk

      - name: Pubblica APK nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Work-Tracker-Android.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish direct Android APK"
            git push
          fi
