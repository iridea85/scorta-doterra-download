name: Add web app to public release

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/publish-web-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-web:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica web app compilata
        run: |
          set -e
          curl -fL 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-33f8-8210-a6b5-21ede2d15b5e/raw?se=2026-09-02T10%3A52%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=9f9ab3d3-a90c-5da8-a645-adda0f4c338f&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T07%3A32%3A54Z&ske=2026-09-03T07%3A32%3A54Z&sks=b&skv=2026-02-06&sig=8T9o1HnWKNGglp46JHCHkt9dMbqqnVfri7Vpht7zol8%3D' -o /tmp/Scorta-doTERRA-Web.zip
          test -s /tmp/Scorta-doTERRA-Web.zip

      - name: Aggiungi web app alla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.11-it /tmp/Scorta-doTERRA-Web.zip --clobber --repo iridea85/scorta-doterra-download
