name: Read Scorta stats once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/read-scorta-stats-once.yml"

permissions:
  contents: read

jobs:
  read-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read CountAPI counters only
        shell: bash
        run: |
          set -euo pipefail
          base='https://countapi.mileshilliard.com/api/v1/get/scorta_doterra_iridea85_v1_'
          for key in views_day_20260905 unique_day_20260905 views_total unique_total app_opens android_clicks ios_clicks last_visit; do
            echo "=== $key ==="
            curl -fsS "${base}${key}" || true
            echo
          done
