name: RW health check once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/rw-health-check-once.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check RW after load test
        shell: bash
        run: |
          python3 - <<'PY'
          import time, urllib.request, urllib.error
          url='https://rw-hub.it/?health_check=post_load'
          times=[]; codes=[]
          for i in range(10):
              t=time.perf_counter()
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Chiara-RW-Health-Check/1.0'})
                  with urllib.request.urlopen(req,timeout=10) as r:
                      codes.append(r.getcode() or 0); r.read(1024)
              except urllib.error.HTTPError as e:
                  codes.append(e.code)
              except Exception:
                  codes.append(0)
              times.append(time.perf_counter()-t)
              time.sleep(.2)
          print('HEALTH codes=', codes)
          print('HEALTH avg_s=', round(sum(times)/len(times),3), 'max_s=', round(max(times),3))
          PY
