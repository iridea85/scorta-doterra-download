name: RW orders auth load once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/rw-orders-auth-load-once.yml"

permissions:
  contents: read

jobs:
  orders-auth-load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Test orders auth gate without writes
        shell: bash
        run: |
          set -euo pipefail
          url='https://rw-hub.it/api/orders'
          ua='Chiara-RW-Orders-Auth-Load/1.0'

          for c in 10 25 50 100; do
            total=200
            out="/tmp/orders-${c}.txt"
            : > "$out"
            export url ua out
            echo "=== concurrency=${c} total=${total} ==="
            seq 1 "$total" | xargs -P "$c" -I{} bash -c '
              curl -sS -o /dev/null --connect-timeout 5 --max-time 12 -A "$ua" \
                -w "%{http_code} %{time_total}\n" "$url" >> "$out" || echo "000 12.000" >> "$out"
            '
            count=$(wc -l < "$out")
            ok401=$(awk '$1==401 {n++} END {print n+0}' "$out")
            bad=$(awk '$1!=401 {n++} END {print n+0}' "$out")
            sort -n -k2 "$out" > "${out}.sorted"
            p95line=$(( (count*95+99)/100 )); [ "$p95line" -lt 1 ] && p95line=1
            p95=$(sed -n "${p95line}p" "${out}.sorted" | awk '{print $2}')
            avg=$(awk '{s+=$2} END {if(NR) printf "%.3f", s/NR; else print "0"}' "$out")
            awk '{codes[$1]++} END {for(code in codes) printf("code_%s=%d\n",code,codes[code])}' "$out" | sort
            echo "expected_401=${ok401} unexpected=${bad} avg_s=${avg} p95_s=${p95}"
            if [ "$bad" -gt 0 ]; then
              echo "STOP_AT_CONCURRENCY=${c}"
              exit 20
            fi
            sleep 2
          done
