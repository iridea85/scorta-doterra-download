name: RW scaling live check once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/rw-scaling-live-check-once.yml"

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live RW responses and edge cache
        shell: bash
        run: |
          set -e
          echo '--- HOME #1 ---'
          curl -fsS -D /tmp/h1 -o /dev/null --max-time 15 -A 'Chiara-RW-Live-Check/1.0' 'https://rw-hub.it/?live_check=1'
          grep -Ei '^(HTTP/|x-rw-edge-cache:|cache-control:|cf-cache-status:)' /tmp/h1 || true
          sleep 1
          echo '--- HOME #2 ---'
          curl -fsS -D /tmp/h2 -o /dev/null --max-time 15 -A 'Chiara-RW-Live-Check/1.0' 'https://rw-hub.it/?live_check=2'
          grep -Ei '^(HTTP/|x-rw-edge-cache:|cache-control:|cf-cache-status:)' /tmp/h2 || true
          echo '--- PRODUCTS #1 ---'
          curl -fsS -D /tmp/p1 -o /dev/null --max-time 15 -A 'Chiara-RW-Live-Check/1.0' 'https://rw-hub.it/api/products'
          grep -Ei '^(HTTP/|x-rw-edge-cache:|cache-control:|cf-cache-status:)' /tmp/p1 || true
          echo '--- PRODUCTS #2 ---'
          curl -fsS -D /tmp/p2 -o /dev/null --max-time 15 -A 'Chiara-RW-Live-Check/1.0' 'https://rw-hub.it/api/products'
          grep -Ei '^(HTTP/|x-rw-edge-cache:|cache-control:|cf-cache-status:)' /tmp/p2 || true
          echo '--- SOLUTIONS #1 ---'
          curl -fsS -D /tmp/s1 -o /dev/null --max-time 15 -A 'Chiara-RW-Live-Check/1.0' 'https://rw-hub.it/api/solutions'
          grep -Ei '^(HTTP/|x-rw-edge-cache:|cache-control:|cf-cache-status:)' /tmp/s1 || true
          echo '--- SOLUTIONS #2 ---'
          curl -fsS -D /tmp/s2 -o /dev/null --max-time 15 -A 'Chiara-RW-Live-Check/1.0' 'https://rw-hub.it/api/solutions'
          grep -Ei '^(HTTP/|x-rw-edge-cache:|cache-control:|cf-cache-status:)' /tmp/s2 || true
