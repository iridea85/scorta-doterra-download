name: Scorta max load once

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/scorta-max-load-once.yml"

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run staged load test
        shell: bash
        run: |
          cat > /tmp/load.mjs <<'NODE'
          const url = 'https://iridea85.github.io/scorta-doterra-download/app-v6/?load_test=max';
          const stages = [
            { c: 500, total: 1500 },
            { c: 1000, total: 3000 },
            { c: 2000, total: 6000 },
          ];
          const ua = 'Chiara-Scorta-Max-Load/1.0';

          async function one() {
            const started = performance.now();
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 10000);
            try {
              const res = await fetch(url, {
                headers: { 'user-agent': ua, 'cache-control': 'no-cache' },
                signal: ctrl.signal,
              });
              await res.arrayBuffer();
              return { ok: res.ok, code: res.status, ms: performance.now() - started };
            } catch {
              return { ok: false, code: 0, ms: performance.now() - started };
            } finally {
              clearTimeout(timer);
            }
          }

          async function runStage(c, total) {
            let next = 0;
            const results = [];
            async function worker() {
              while (true) {
                const i = next++;
                if (i >= total) return;
                results[i] = await one();
              }
            }
            const t0 = performance.now();
            await Promise.all(Array.from({ length: c }, worker));
            const elapsed = (performance.now() - t0) / 1000;
            const times = results.map(r => r.ms / 1000).sort((a,b)=>a-b);
            const bad = results.filter(r => !r.ok).length;
            const codeCounts = {};
            for (const r of results) codeCounts[r.code] = (codeCounts[r.code] || 0) + 1;
            const pct = p => times[Math.min(times.length - 1, Math.ceil(times.length * p) - 1)] || 0;
            const avg = times.reduce((a,b)=>a+b,0) / times.length;
            const badPct = bad * 100 / total;
            console.log(`=== concurrency=${c} total=${total} ===`);
            console.log(`codes=${JSON.stringify(codeCounts)}`);
            console.log(`ok=${total-bad} bad=${bad} bad_pct=${badPct.toFixed(3)} avg_s=${avg.toFixed(3)} p50_s=${pct(.50).toFixed(3)} p95_s=${pct(.95).toFixed(3)} p99_s=${pct(.99).toFixed(3)} max_s=${times.at(-1).toFixed(3)} elapsed_s=${elapsed.toFixed(3)} rps=${(total/elapsed).toFixed(1)}`);
            return { badPct, p95: pct(.95) };
          }

          for (const s of stages) {
            const r = await runStage(s.c, s.total);
            if (r.badPct > 0.5 || r.p95 > 2.0) {
              console.log(`SAFETY_STOP concurrency=${s.c}`);
              process.exit(20);
            }
            await new Promise(r => setTimeout(r, 3000));
          }
          console.log('ALL_STAGES_PASSED=1');
          NODE
          node /tmp/load.mjs
