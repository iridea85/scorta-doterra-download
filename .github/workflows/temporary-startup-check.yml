name: Temporary startup check
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/temporary-startup-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install browser dependency
        run: |
          mkdir -p /tmp/scorta-check
          cd /tmp/scorta-check
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24.16.0 --no-audit --no-fund >/dev/null
      - name: Verify live app startup and inventory controls
        run: |
          cd /tmp/scorta-check
          cat > test.js <<'NODE'
          const puppeteer=require('puppeteer-core');
          const {execSync}=require('child_process');
          const chrome=execSync('command -v google-chrome || command -v chromium || command -v chromium-browser').toString().trim();
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const assert=(v,m)=>{if(!v) throw new Error(m)};
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            page.on('dialog',d=>d.accept());
            await page.goto('https://iridea85.github.io/scorta-doterra-download/app-v14/?startup='+Date.now(),{waitUntil:'networkidle2',timeout:60000});
            await page.waitForSelector('[data-mainnav="inventory"]',{timeout:30000});
            console.log('PASS app supera splash e mostra navigazione');
            await page.click('[data-mainnav="catalog"]');
            await page.waitForSelector('#scpCatalogSearch',{timeout:15000});
            await page.$eval('#scpCatalogSearch',el=>{el.value='Palmarosa';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.waitForFunction(()=>[...document.querySelectorAll('[data-catalog-name]')].some(c=>(c.dataset.catalogName||'').toLowerCase().includes('palmarosa')),{timeout:10000});
            await page.evaluate(()=>{const c=[...document.querySelectorAll('[data-catalog-name]')].find(x=>(x.dataset.catalogName||'').toLowerCase().includes('palmarosa'));c.querySelector('[data-action="catInventory"]').click()});
            await sleep(300);
            await page.click('[data-mainnav="inventory"]');
            await page.waitForSelector('.scp-stock-editor[data-stock-ui="5"]',{timeout:10000});
            const labels=await page.$$eval('.scp-stock-box-title',els=>els.map(e=>e.textContent.trim()));
            assert(labels.includes('Chiusi')&&labels.includes('Aperti'),'Controlli Chiusi/Aperti mancanti');
            assert(await page.$('.scp-auto-toggle'),'Riordino automatico mancante');
            console.log('PASS Chiusi / Aperti / Riordino automatico visibili');
            await page.$eval('.scp-auto-toggle',el=>el.click());
            await sleep(300);
            const thresholdVisible=await page.$eval('.scp-threshold-row',el=>!el.hidden);
            assert(thresholdVisible,'Soglia non compare dopo attivazione');
            console.log('PASS soglia automatica attivabile');
            await sleep(1200);
            const responsive=await page.evaluate(()=>document.querySelectorAll('[data-mainnav]').length===3);
            assert(responsive,'Pagina non responsiva dopo attesa');
            const relevant=errors.filter(e=>!e.includes('favicon')&&!e.includes('Failed to load resource'));
            assert(relevant.length===0,'Errori JS: '+relevant.join(' | '));
            console.log('STARTUP CHECK COMPLETO: OK');
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
          node test.js
