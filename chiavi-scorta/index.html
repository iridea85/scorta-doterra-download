<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6e5578">
<meta name="description" content="Accesso rapido al generatore privato delle chiavi Scorta doTERRA.">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="../app-v7/icons/Icon-192.png">
<link rel="apple-touch-icon" href="../app-v7/icons/Icon-192.png">
<title>Chiavi Scorta</title>
<style>
:root{--brand:#6e5578;--bg:#f7f4f7;--ink:#2b242d;--muted:#756d78;--line:#e6dfe8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fbf9fb,#f2edf4);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);display:grid;place-items:center;padding:22px}
.card{width:min(100%,420px);background:#fff;border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:0 18px 50px rgba(65,44,70,.12);text-align:center}
.icon{width:88px;height:88px;border-radius:24px;display:block;margin:0 auto 17px}
h1{font-size:28px;margin:0;font-weight:900;letter-spacing:-.6px}.sub{margin:9px 0 22px;color:var(--muted);font-size:14px;line-height:1.5}
.btn{width:100%;min-height:56px;border:0;border-radius:17px;padding:14px 16px;font-size:15px;font-weight:900;background:var(--brand);color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;margin-top:11px}
.btn.secondary{background:#f2edf4;color:var(--brand);border:1px solid #dcd2df}.hint{font-size:11px;color:#948c96;line-height:1.45;margin-top:17px}
</style>
</head>
<body>
<main class="card">
  <img class="icon" src="../app-v7/icons/Icon-192.png" alt="">
  <h1>Chiavi Scorta</h1>
  <div class="sub">Accesso rapido al generatore privato delle chiavi di attivazione Scorta doTERRA.</div>

  <a class="btn" id="generator" href="https://github.com/iridea85/work-tracker/actions/workflows/generate-scorta-license.yml">🔑 Crea una chiave</a>
  <button class="btn secondary" id="install" type="button">⬇ Installa sulla Home</button>

  <div class="hint">Il generatore resta nel tuo GitHub privato. Per usarlo devi essere collegata al tuo account GitHub.</div>
</main>

<script>
(() => {
  const installBtn=document.getElementById('install');
  let promptEvent=null;

  const standalone=
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone===true;

  if(standalone){
    installBtn.style.display='none';
  }

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }

  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();
    promptEvent=e;
    installBtn.disabled=false;
  });

  installBtn.addEventListener('click',async()=>{
    if(promptEvent){
      const p=promptEvent;
      promptEvent=null;
      await p.prompt();
      await p.userChoice;
      return;
    }

    if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){
      alert('Su iPhone: Safari → Condividi → Aggiungi alla schermata Home.');
      return;
    }

    alert('Apri questa pagina in Chrome e usa “Installa app” oppure “Aggiungi alla schermata Home”.');
  });
})();
</script>
</body>
</html>
