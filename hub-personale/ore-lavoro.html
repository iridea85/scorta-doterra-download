<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Ore di lavoro</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#17171a;--muted:#72727a;--line:#e7e7eb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
main{width:min(620px,calc(100% - 28px));margin:auto;padding:28px 0 42px}
.back{display:inline-block;color:#5c5c63;text-decoration:none;font-weight:700;margin:0 0 18px}
.hero{text-align:center;padding:8px 8px 22px}.icon{width:86px;height:86px;border-radius:25px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:40px;margin:0 auto 16px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
h1{margin:0;font-size:32px;letter-spacing:-1px}.sub{margin:8px 0 0;color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px}
.device{font-size:12px;font-weight:900;color:#777}.card h2{font-size:20px;margin:8px 0 8px}.card p{font-size:13px;line-height:1.45;color:var(--muted);min-height:58px}
a.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:15px;background:#17171a;color:#fff;text-decoration:none;font-weight:900;margin-top:14px}.ios a.btn{background:#ececef;color:#17171a}
@media(max-width:520px){.grid{grid-template-columns:1fr}.card p{min-height:auto}}
</style>
</head>
<body>
<main>
